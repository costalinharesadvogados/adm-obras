<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Controle de reformas residenciais: plantas, fotos, materiais, estoque, custos e tarefas por ambiente.">
<title>Obra em Dia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obra em Dia">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#16191d; --ink2:#5a6472; --line:#e2e5ea;
  --brand:#1d4ed8; --brand-ink:#ffffff; --brand-soft:#e8eefc;
  --ok:#0f8a4a; --ok-soft:#e3f5eb; --warn:#b45309; --warn-soft:#fdf0dd;
  --bad:#c62828; --bad-soft:#fdeaea;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --r:14px; --tap:48px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --navh:64px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1216;--card:#181c22;--ink:#eef1f5;--ink2:#a2adbb;--line:#2a313a;
  --brand:#4c86f7;--brand-ink:#08101f;--brand-soft:#1b2740;
  --ok:#4ade80;--ok-soft:#12301f;--warn:#fbbf24;--warn-soft:#33260c;
  --bad:#f87171;--bad-soft:#3a1618;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- topo ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;
  padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 12px) 10px calc(var(--safe-l) + 12px);
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.hrow{display:flex;align-items:center;gap:8px;min-height:var(--tap)}
.hback{width:var(--tap);height:var(--tap);border-radius:12px;display:none;place-items:center;font-size:24px;color:#fff;flex:0 0 auto}
.hback.on{display:grid}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle span{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:var(--tap);height:var(--tap);border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;flex:0 0 auto;background:rgba(255,255,255,.14)}
.hbtn:active{background:rgba(255,255,255,.3)}

/* ---------- layout ---------- */
main{
  padding:14px calc(var(--safe-r) + 12px) calc(var(--navh) + var(--safe-b) + 28px) calc(var(--safe-l) + 12px);
  max-width:900px;margin:0 auto;
}
.view{display:none}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- nav inferior ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);
  border-top:1px solid var(--line);
  padding:0 calc(var(--safe-r)) var(--safe-b) calc(var(--safe-l));
  display:flex;
}
nav button{
  flex:1;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--ink2);font-size:11px;font-weight:600;padding:6px 2px;position:relative;
}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
nav .badge{position:absolute;top:7px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--bad);color:#fff;font-size:10px;line-height:17px;text-align:center;font-weight:700}

/* ---------- cartões ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;overflow-wrap:break-word}
.list b,.card b{overflow-wrap:break-word}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px}
@media(min-width:430px){.mini{grid-template-columns:repeat(4,1fr)}}
.mini>div{min-width:0}
.mini span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.995);border-color:var(--brand)}
.sec{margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px}
.right{text-align:right}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}

/* ---------- botões ---------- */
.btn{min-height:var(--tap);padding:0 16px;border-radius:12px;background:var(--brand);color:var(--brand-ink);
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.btn:active{filter:brightness(.92)}
.btn.gh{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.gh:active{border-color:var(--brand);color:var(--brand)}
.btn.dz{background:var(--bad-soft);color:var(--bad);border:1.5px solid transparent}
.btn.wide{width:100%}
.btn.sm{min-height:48px;padding:0 14px;font-size:14.5px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:12px;display:grid;place-items:center;font-size:19px;color:var(--ink2);flex:0 0 auto}
.iconbtn:active{background:var(--brand-soft);color:var(--brand)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:130px}

/* ---------- chips / filtro ---------- */
.chipwrap{position:relative;margin:0 -4px}
.chipwrap::after{content:"";position:absolute;top:0;right:0;bottom:8px;width:28px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--bg))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:48px;padding:0 15px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink2);font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
  background:var(--brand-soft);color:var(--brand)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- métricas ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:700}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .3s}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)}

/* ---------- formulários ---------- */
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;min-height:var(--tap);padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,select,textarea:focus{outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--ink2);margin-top:6px}
.err{font-size:13px;color:var(--bad);margin-top:6px;font-weight:600;display:none}
.err.on{display:block}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
@media(min-width:640px){.ov.on{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@media(min-width:640px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
.sheet header{position:static;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:6px 8px 6px 16px;box-shadow:none}
.sheet header .hrow h3{font-size:17px;flex:1}
.sbody{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sfoot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--card);display:flex;gap:10px}
.sfoot .btn{flex:1}

/* ---------- listas ---------- */
.item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);min-height:var(--tap)}
.item:last-child{border-bottom:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--brand-soft);color:var(--brand);flex:0 0 auto;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.capa{width:100%;height:112px;border-radius:11px;object-fit:cover;display:block;margin-bottom:10px;background:var(--brand-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;
  font-size:17px;color:transparent;background:var(--card)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.done .tt{text-decoration:line-through;color:var(--ink2)}
.tapzone{min-width:var(--tap);min-height:var(--tap);display:grid;place-items:center;margin:-9px -9px -9px 0;padding:9px}

/* ---------- arquivos ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.faixa{display:flex;gap:9px;overflow-x:auto;padding:2px 4px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.faixa::-webkit-scrollbar{display:none}
.faixa .thumb{flex:0 0 96px;width:96px;height:96px;aspect-ratio:auto}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .doc{font-size:30px;color:var(--ink2)}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:10.5px;color:#fff;font-weight:600;
  background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .kind{position:absolute;top:5px;left:5px;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.6);color:#fff;text-transform:uppercase}
.viewer{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer .vtop{display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 6px) 8px 6px;color:#fff;background:rgba(0,0,0,.6)}
.viewer .vtop .grow{font-size:14px;font-weight:600}
.viewer .vbody{flex:1;overflow:auto;display:grid;place-items:center;padding:8px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vfoot{padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:10px;background:rgba(0,0,0,.6)}

/* ---------- diversos ---------- */
.empty{text-align:center;padding:34px 18px;color:var(--ink2)}
.empty .big{font-size:44px;margin-bottom:8px;opacity:.55}
.empty p{margin:6px 0 16px;font-size:14.5px}
.fab{position:fixed;right:calc(var(--safe-r) + 14px);bottom:calc(var(--navh) + var(--safe-b) + 14px);z-index:44;
  width:58px;height:58px;border-radius:29px;background:var(--brand);color:var(--brand-ink);font-weight:700;
  box-shadow:0 6px 20px rgba(29,78,216,.42);display:grid;place-items:center;font-size:24px;border:2px solid var(--bg)}
.fab:active{transform:scale(.97)}
.fab.oculto{transform:translateY(140%);opacity:0;pointer-events:none;transition:.2s}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + var(--safe-b) + 20px);transform:translate(-50%,14px);
  z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:24px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;gap:12px;text-align:center}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.money{font-variant-numeric:tabular-nums;font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="loading" id="boot"><div><div class="spin"></div><b>Obra em Dia</b><div class="small muted">carregando seus projetos…</div></div></div>

<header>
  <div class="hrow">
    <button class="hback" id="btnBack" aria-label="Voltar">‹</button>
    <div class="htitle"><b id="hTitle">Obra em Dia</b><span id="hSub">—</span></div>
    <button class="hbtn" id="fabClaude" aria-label="Perguntar ao Claude" title="Perguntar ao Claude">✨</button>
    <button class="hbtn" id="btnUnits" aria-label="Trocar de unidade" title="Trocar de unidade">🏠</button>
    <button class="hbtn" id="btnMenu" aria-label="Menu" title="Menu">⋯</button>
  </div>
</header>

<main>
  <!-- PAINEL -->
  <section class="view on" id="v-painel">
    <div class="kpis" id="kpis"></div>
    <div class="card" id="cardProg"></div>
    <div class="card" id="cardOrc"></div>
    <div id="secFotos"></div>
    <div class="sec"><h2>Ambientes</h2><button class="btn sm gh" data-go="ambientes">Ver todos</button></div>
    <div id="painelAmb"></div>
    <div class="sec"><h2>Próximas tarefas</h2><button class="btn sm gh" data-go="tarefas">Ver todas</button></div>
    <div id="painelTar"></div>
    <div class="sec"><h2>Atenção</h2></div>
    <div id="painelAlerta"></div>
    <button class="btn gh wide" id="claudePainel">✨ Perguntar ao Claude sobre a obra</button>
  </section>

  <!-- AMBIENTES -->
  <section class="view" id="v-ambientes">
    <div id="listaAmb"></div>
    <button class="btn wide gh" id="addAmb">＋ Novo ambiente</button>
  </section>

  <!-- MATERIAIS -->
  <section class="view" id="v-materiais">
    <div class="chipwrap"><div class="chips" id="filtroMat"></div></div>
    <div class="card" id="resumoMat"></div>
    <div id="listaMat"></div>
    <button class="btn wide gh" id="addMat">＋ Novo material</button>
  </section>

  <!-- TAREFAS -->
  <section class="view" id="v-tarefas">
    <div class="chipwrap"><div class="chips" id="filtroTar"></div></div>
    <div class="chipwrap" id="wrapResp"><div class="chips" id="filtroResp"></div></div>
    <div class="small muted" id="resumoTar" style="margin:2px 0 8px"></div>
    <div class="btns" style="margin-bottom:10px">
      <button class="btn sm gh" id="copiarTar">📋 Copiar lista</button>
      <button class="btn sm gh" id="toggleFeitas">Mostrar feitas</button>
    </div>
    <div id="listaTar"></div>
    <button class="btn wide gh" id="addTar">＋ Nova tarefa</button>
  </section>

  <!-- ARQUIVOS -->
  <section class="view" id="v-arquivos">
    <div class="chipwrap"><div class="chips" id="filtroArq"></div></div>
    <div class="chipwrap"><div class="chips" id="filtroCat"></div></div>
    <div class="row" style="margin:2px 0 10px"><div class="grow small muted" id="resumoArq"></div></div>
    <div class="grid" id="gridArq"></div>
    <div id="vazioArq"></div>
    <div style="height:12px"></div>
    <button class="btn wide gh" id="addArq">＋ Adicionar planta ou foto</button>
  </section>

  <!-- AMBIENTE (detalhe) -->
  <section class="view" id="v-ambiente">
    <div class="card" id="ambHead"></div>
    <div id="ambRevest"></div>
    <div class="chipwrap"><div class="chips" id="ambTabs"></div></div>
    <div id="ambConteudo"></div>
  </section>
</main>

<nav id="nav">
  <button data-v="painel" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M9.8 19.5v-6h4.4v6"/></svg>Painel</button>
  <button data-v="ambientes"><svg viewBox="0 0 24 24"><rect x="3.2" y="4.2" width="17.6" height="15.6" rx="2.2"/><path d="M3.2 12h17.6M12 4.2v15.6"/></svg>Ambientes</button>
  <button data-v="materiais"><svg viewBox="0 0 24 24"><path d="M3.5 7.6 12 3.4l8.5 4.2v8.8L12 20.6 3.5 16.4z"/><path d="M3.5 7.6 12 11.8l8.5-4.2M12 11.8v8.8"/></svg>Materiais</button>
  <button data-v="tarefas"><svg viewBox="0 0 24 24"><path d="m3.6 7.4 2.3 2.3 3.6-3.6"/><path d="m3.6 16.4 2.3 2.3 3.6-3.6"/><path d="M13 7.9h7.4M13 16.9h7.4"/></svg>Tarefas<span class="badge" id="badgeTar" hidden></span></button>
  <button data-v="arquivos"><svg viewBox="0 0 24 24"><rect x="3.3" y="4.6" width="17.4" height="14.8" rx="2.2"/><path d="m4.6 16.6 4.3-4.5 3.1 3 2.7-2.4 4.7 4.4"/><circle cx="9" cy="9.1" r="1.5"/></svg>Arquivos</button>
</nav>

<!-- modal genérico -->
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="sheet">
    <header><div class="hrow"><h3 id="ovTitle">—</h3><button class="iconbtn" id="ovClose" aria-label="Fechar">✕</button></div></header>
    <div class="sbody" id="ovBody"></div>
    <div class="sfoot" id="ovFoot"></div>
  </div>
</div>

<!-- visualizador de arquivo -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <div class="vtop">
    <button class="iconbtn" id="vClose" style="color:#fff" aria-label="Fechar">✕</button>
    <div class="grow ell" id="vName">—</div>
  </div>
  <div class="vbody" id="vBody"></div>
  <div class="vfoot">

<script>
"use strict";
/* ============================================================
   Obra em Dia — controle de reformas residenciais
   Dados no próprio aparelho (IndexedDB). Nada sai daqui.
   ============================================================ */

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = n => (isFinite(n) ? n : 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtNum = (n, d = 2) => (isFinite(n) ? n : 0).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:d});
const fmtM = n => (isFinite(n) ? n : 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
function parseNum(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (!v) return 0;
  let s = String(v).trim().replace(/[^\d.,-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');  // 50.000 = cinquenta mil
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const pl = (n, s1, s2) => `${n} ${n === 1 ? s1 : (s2 || s1 + 's')}`;
const hoje = () => new Date().toISOString().slice(0, 10);
function fmtData(iso){
  if (!iso) return '';
  const p = String(iso).slice(0,10).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
}
function diasAte(iso){
  if (!iso) return null;
  const a = new Date(iso + 'T00:00:00'), b = new Date(hoje() + 'T00:00:00');
  return Math.round((a - b) / 86400000);
}
function fmtBytes(b){
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(0) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
let toastT;
function toast(msg, ms = 2400){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}

/* ---------- banco local ---------- */
const DB_NAME = 'obraemdia', DB_VER = 1;
let _db = null;
function db(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', {keyPath:'id'});
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode), s = t.objectStore(store);
    let out; try { out = fn(s); } catch(e){ rej(e); return; }
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('transação abortada'));
  }));
}
const dbGet   = (store, k) => tx(store, 'readonly',  s => s.get(k));
const dbPut   = (store, v, k) => tx(store, 'readwrite', s => s.put(v, k));
const dbDel   = (store, k) => tx(store, 'readwrite', s => s.delete(k));
const dbAll   = store => tx(store, 'readonly', s => s.getAll());
const dbKeys  = store => tx(store, 'readonly', s => s.getAllKeys());

/* ---------- estado ---------- */
let S = null;                                   // estado do app
const ui = { view:'painel', amb:null, filtroAmb:'all', filtroCat:'all', ambTab:'arquivos', verFeitas:false, soFalta:false, filtroResp:'all' };
let salvarT;
function salvar(imediato){
  clearTimeout(salvarT);
  const go = () => dbPut('kv', JSON.parse(JSON.stringify(S)), 'state').catch(e => {
    console.error(e); toast('⚠️ Não consegui salvar. Espaço do aparelho cheio?', 5000);
  });
  if (imediato) return go();
  salvarT = setTimeout(go, 250);
}
const ABERTURAS_PADRAO = {
  porta:  {nome:'Porta',  largura:0.80, altura:2.10},
  janela: {nome:'Janela', largura:1.20, altura:1.10},
  box:    {nome:'Box',    largura:0.90, altura:1.90}
};
function revestPadrao(nome){
  const n = (nome || '').toLowerCase();
  const molhado = n.includes('banheiro') || n.includes('lavabo') || n.includes('cozinha') || n.includes('área de serviço');
  return {modo: molhado ? 'piso+paredes' : 'piso', alturaParede:0, perda:10, aberturas:[], m2Caixa:0};
}
const AMBIENTES_INICIAIS = ['Suíte Arthur','Banheiro Arthur','Banheiro Suíte Master','Banheiro Social','Banheiro Francisco'];
function novoAmbiente(nome){
  return {id:uid(), nome, obs:'', largura:0, comprimento:0, peDireito:0,
    revest:revestPadrao(nome), arquivos:[], materiais:[], tarefas:[]};
}
function estadoInicial(){
  return {
    v: 1,
    unidadeAtual: null,
    unidades: [{
      id: uid(), nome: 'AP 103A — Porto das Dunas', endereco: '', orcamento: 0,
      criadoEm: hoje(), ambientes: AMBIENTES_INICIAIS.map(novoAmbiente)
    }]
  };
}
const U = () => S.unidades.find(u => u.id === S.unidadeAtual) || S.unidades[0];
const A = id => { const u = U(); return u ? u.ambientes.find(a => a.id === id) : null; };
const nomeAmb = id => { const a = A(id); return a ? a.nome : 'Sem ambiente'; };

/* ---------- cálculos ---------- */
const estoqueMat = m => parseNum(m.qtdComprada) - parseNum(m.qtdUsada);
const faltaMat   = m => Math.max(0, parseNum(m.qtdPrevista) - parseNum(m.qtdComprada));
const custoMat   = m => parseNum(m.qtdComprada) * parseNum(m.precoUnit);
const custoPrev  = m => Math.max(parseNum(m.qtdPrevista), parseNum(m.qtdComprada)) * parseNum(m.precoUnit);
function statusMat(m){
  if (faltaMat(m) > 0) return {t:'Falta comprar', c:'warn'};
  if (estoqueMat(m) > 0) return {t:'Em estoque', c:'ok'};
  if (parseNum(m.qtdComprada) > 0) return {t:'Aplicado', c:''};
  return {t:'A definir', c:''};
}
function totaisUnidade(){
  const u = U(); const r = {gasto:0, previsto:0, mats:0, faltando:0, faltaValor:0, tarefas:0, feitas:0, atrasadas:0, arquivos:0, ambientes:0};
  if (!u) return r;
  r.ambientes = u.ambientes.length;
  u.ambientes.forEach(a => {
    a.materiais.forEach(m => { r.gasto += custoMat(m); r.previsto += custoPrev(m); r.mats++;
      if (faltaMat(m) > 0){ r.faltando++; r.faltaValor += faltaMat(m) * parseNum(m.precoUnit); } });
    a.tarefas.forEach(t => { if (t.feita) r.feitas++; else { r.tarefas++; const d = diasAte(t.prazo); if (d !== null && d < 0) r.atrasadas++; } });
    r.arquivos += a.arquivos.length;
  });
  return r;
}
function totaisAmb(a){
  const r = {gasto:0, previsto:0, mats:a.materiais.length, faltando:0, tarefas:0, feitas:0, arquivos:a.arquivos.length};
  a.materiais.forEach(m => { r.gasto += custoMat(m); r.previsto += custoPrev(m); if (faltaMat(m) > 0) r.faltando++; });
  a.tarefas.forEach(t => t.feita ? r.feitas++ : r.tarefas++);
  return r;
}
const areaPiso = a => parseNum(a.largura) * parseNum(a.comprimento);
const perimetro = a => 2 * (parseNum(a.largura) + parseNum(a.comprimento));
const areaParede = a => perimetro(a) * parseNum(a.peDireito);
const MODOS = {
  'piso':         'Só o piso',
  'piso+paredes': 'Piso e paredes',
  'paredes':      'Só as paredes',
  'nenhum':       'Não vai revestir'
};
function calcRevest(a){
  const r = a.revest || revestPadrao(a.nome);
  const modo = r.modo || 'piso';
  const alt = parseNum(r.alturaParede) || parseNum(a.peDireito);
  const perda = parseNum(r.perda);
  const piso = areaPiso(a);
  const paredeBruta = perimetro(a) * alt;
  // a abertura só desconta a parte dela que fica dentro da faixa revestida
  const desc = (r.aberturas || []).reduce((t, ab) => {
    const hEfetiva = Math.min(parseNum(ab.altura), alt || parseNum(ab.altura));
    return t + parseNum(ab.largura) * hEfetiva * Math.max(1, parseNum(ab.qtd) || 1);
  }, 0);
  const paredeLiq = Math.max(0, paredeBruta - desc);
  const usaPiso = modo === 'piso' || modo === 'piso+paredes';
  const usaParede = modo === 'paredes' || modo === 'piso+paredes';
  const total = (usaPiso ? piso : 0) + (usaParede ? paredeLiq : 0);
  const comPerda = total * (1 + perda / 100);
  const m2Caixa = parseNum(r.m2Caixa);
  return {modo, rotulo:MODOS[modo] || MODOS.piso, alt, perda, piso, perimetro:perimetro(a),
    paredeBruta, descontos:desc, paredeLiq, usaPiso, usaParede, total, comPerda,
    m2Caixa, caixas: m2Caixa > 0 ? Math.ceil(comPerda / m2Caixa) : null,
    completo: piso > 0 && (!usaParede || alt > 0)};
}

/* ---------- arquivos: compressão e cache ---------- */
const urlCache = new Map();
function urlDe(id, blob){
  if (urlCache.has(id)) return urlCache.get(id);
  const u = URL.createObjectURL(blob); urlCache.set(id, u); return u;
}
function limparUrl(id){
  if (urlCache.has(id)){ URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); }
  if (urlCache.has(id + ':t')){ URL.revokeObjectURL(urlCache.get(id + ':t')); urlCache.delete(id + ':t'); }
}
function comprimir(file, max, q){
  return new Promise(res => {
    const img = new Image(), fr = new FileReader();
    const falhou = () => res(null);
    img.onload = () => {
      try {
        let {width:w, height:h} = img;
        if (!w || !h) return falhou();
        const fator = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * fator); h = Math.round(h * fator);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(b => res(b || null), 'image/jpeg', q);
      } catch(e){ falhou(); }
    };
    img.onerror = falhou;
    fr.onload = () => { img.src = fr.result; };
    fr.onerror = falhou;
    fr.readAsDataURL(file);
  });
}
async function guardarArquivo(file, cat, matId){
  const id = uid();
  const ehImg = /^image\//.test(file.type);
  let blob = file, thumb = null;
  if (ehImg){
    const g = await comprimir(file, 1600, 0.72);
    const t = await comprimir(file, 320, 0.6);
    if (g && g.size < file.size) blob = g;
    thumb = t || null;
  }
  await dbPut('files', {id, blob, thumb, nome:file.name, tipo:file.type});
  return {id, nome:file.name || 'arquivo', tipo:file.type || '', cat:cat || 'foto', tamanho:blob.size, data:hoje(), matId:matId || null};
}
async function apagarArquivo(fid){
  limparUrl(fid);
  try { await dbDel('files', fid); } catch(e){ console.warn(e); }
}
const CATS = {planta:'📐 Planta', foto:'📷 Foto', recibo:'🧾 Recibo', orcamento:'📄 Orçamento', outro:'📎 Outro'};
const icoCat = c => (CATS[c] || CATS.outro).slice(0, 2);
</script>
<script>
"use strict";
/* ============================ NAVEGAÇÃO ============================ */
function irPara(v, opts){
  if (v !== 'materiais') ui.soFalta = false;
  ui.view = v;
  if (opts && opts.amb !== undefined) ui.amb = opts.amb;
  $$('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === (v === 'ambiente' ? 'ambientes' : v)));
  const back = v === 'ambiente';
  $('#btnBack').classList.toggle('on', back);
  window.scrollTo(0, 0);
  render();
}
function render(){
  const u = U();
  if (!u){ return; }
  const t = totaisUnidade();
  const b = $('#badgeTar');
  if (t.tarefas > 0){ b.hidden = false; b.textContent = t.tarefas > 99 ? '99+' : t.tarefas; } else b.hidden = true;
  const titulos = {painel:'Obra em Dia', ambientes:'Ambientes', materiais:'Materiais', tarefas:'Tarefas', arquivos:'Arquivos'};
  if (ui.view === 'ambiente'){
    const a = A(ui.amb);
    $('#hTitle').textContent = a ? a.nome : 'Ambiente';
    $('#hSub').textContent = u.nome;
  } else {
    $('#hTitle').textContent = titulos[ui.view] || 'Obra em Dia';
    $('#hSub').textContent = u.nome + (u.ambientes.length ? ` · ${u.ambientes.length} ambiente${u.ambientes.length>1?'s':''}` : '');
  }
  $('#fabClaude').style.display = 'grid';
  $('#btnUnits').style.display = S.unidades.length > 1 ? 'grid' : 'none';
  ({painel:renderPainel, ambientes:renderAmbientes, materiais:renderMateriais,
    tarefas:renderTarefas, arquivos:renderArquivos, ambiente:renderAmbiente}[ui.view] || renderPainel)();
}

/* ============================ PAINEL ============================ */
function renderPainel(){
  const u = U(), t = totaisUnidade();
  $('#kpis').innerHTML = `
    <div class="kpi"><span>Gasto</span><b class="money">${fmtBRL(t.gasto)}</b></div>
    <div class="kpi"><span>Previsto</span><b class="money">${fmtBRL(t.previsto)}</b></div>
    <div class="kpi"><span>Em aberto</span><b>${t.tarefas}${t.atrasadas ? ` <span class="tag bad">${pl(t.atrasadas,'atrasada')}</span>` : ''}</b></div>
    <div class="kpi"><span>Arquivos</span><b>${t.arquivos}</b></div>`;

  const tot = t.feitas + t.tarefas;
  const pctT = tot ? (t.feitas / tot) * 100 : 0;
  $('#cardProg').innerHTML = `<div class="row"><div class="grow"><b>Andamento da obra</b>
      <div class="small muted">${t.feitas} de ${tot} ${tot === 1 ? 'tarefa concluída' : 'tarefas concluídas'}${t.faltando ? ` · ${fmtBRL(t.faltaValor)} ainda por comprar` : ''}</div></div>
      <div class="right"><b style="font-size:19px">${fmtNum(pctT,0)}%</b></div></div>
    <div class="bar"><i style="width:${pctT}%"></i></div>`;

  const orc = parseNum(u.orcamento);
  const pct = orc > 0 ? Math.min(100, (t.gasto / orc) * 100) : 0;
  const cls = pct > 100 ? 'bad' : pct > 80 ? 'warn' : '';
  $('#cardOrc').innerHTML = orc > 0 ? `
    <div class="row"><div class="grow"><b>Orçamento da obra</b><div class="small muted">${fmtBRL(t.gasto)} de ${fmtBRL(orc)}</div></div>
    <div class="right"><b class="money" style="font-size:19px">${fmtNum(pct,0)}%</b><div class="tiny muted">${t.gasto > orc ? 'estourou ' + fmtBRL(t.gasto-orc) : 'restam ' + fmtBRL(orc - t.gasto)}</div></div></div>
    <div class="bar"><i class="${cls}" style="width:${Math.min(100,pct)}%"></i></div>`
   : `<b>Definir orçamento</b><div class="small muted" style="margin:3px 0 10px">Informe o teto da obra para acompanhar o quanto já foi gasto.</div>
      <button class="btn sm gh wide" onclick="editarUnidade('${u.id}')">Definir orçamento</button>`;

  const ambs = u.ambientes.slice().sort((a,b) => totaisAmb(b).gasto - totaisAmb(a).gasto).slice(0, 4);
  $('#painelAmb').innerHTML = ambs.length ? '<div class="list">' + ambs.map(a => {
    const x = totaisAmb(a);
    return `<div class="item" role="button" tabindex="0" onclick="irPara('ambiente',{amb:'${a.id}'})">
      <div class="av" data-capa="${a.id}">${icoAmb(a.nome)}</div>
      <div class="grow"><div class="ell"><b>${esc(a.nome)}</b></div>
      <div class="tiny muted">${pl(x.mats,'material','materiais')} · ${pl(x.tarefas,'tarefa aberta','tarefas abertas')} · ${pl(x.arquivos,'arquivo')}</div></div>
      <div class="right"><div class="money small">${fmtBRL(x.gasto)}</div></div><div class="muted">›</div></div>`;
  }).join('') + '</div>' : vazio('◫', 'Nenhum ambiente ainda', 'Crie o primeiro ambiente da obra.', 'addAmb');
  pintarCapas($('#painelAmb'));

  const fotos = [];
  u.ambientes.forEach(a => a.arquivos.forEach(f => { if (/^image\//.test(f.tipo || '')) fotos.push({...f, ambId:a.id, amb:a.nome}); }));
  fotos.sort((x, y) => (y.data || '').localeCompare(x.data || ''));
  if (fotos.length){
    $('#secFotos').innerHTML = `<div class="sec"><h2>Registro recente</h2><button class="btn sm gh" data-go2="arquivos">Ver todos</button></div>
      <div class="faixa" id="faixaFotos"></div>`;
    $('#secFotos').querySelector('[data-go2]').onclick = () => irPara('arquivos');
    pintarArquivos(fotos.slice(0, 8), $('#faixaFotos'), document.createElement('div'), null);
  } else $('#secFotos').innerHTML = '';

  const prox = [];
  u.ambientes.forEach(a => a.tarefas.forEach(t2 => { if (!t2.feita) prox.push({...t2, amb:a.nome, ambId:a.id}); }));
  prox.sort(ordenaTarefa);
  $('#painelTar').innerHTML = prox.length ? '<div class="list">' + prox.slice(0, 5).map(t2 => linhaTarefa(t2, true)).join('') + '</div>'
    : `<div class="card"><div class="small muted">Nenhuma tarefa aberta. 👏</div></div>`;

  const al = [];
  if (t.atrasadas) al.push(['bad', `${pl(t.atrasadas,'tarefa')} com prazo vencido`, 'tarefas']);
  if (t.faltando) al.push(['warn', `${pl(t.faltando,'material','materiais')} por comprar — ${fmtBRL(t.faltaValor)}`, 'compras']);
  if (orc > 0 && t.gasto > orc) al.push(['bad', `Gasto acima do orçamento em ${fmtBRL(t.gasto - orc)}`, 'materiais']);
  if (!t.arquivos) al.push(['', 'Nenhuma planta ou foto guardada ainda', 'arquivos']);
  $('#painelAlerta').innerHTML = al.length ? '<div class="list">' + al.map(([c, txt, v]) =>
    `<div class="item" role="button" tabindex="0" onclick="${v === 'compras' ? "irPara('materiais');ui.soFalta=true;render()" : `irPara('${v}')`}"><div class="av" style="background:var(--${c||'brand'}-soft);color:var(--${c||'brand'})">!</div>
    <div class="grow small">${esc(txt)}</div><div class="muted">›</div></div>`).join('') + '</div>'
    : `<div class="card"><div class="small muted">Tudo em ordem por aqui. ✅</div></div>`;
}
function icoAmb(nome){
  const n = (nome || '').toLowerCase();
  if (n.includes('banheiro') || n.includes('lavabo')) return '🚿';
  if (n.includes('cozinha')) return '🍳';
  if (n.includes('quarto') || n.includes('suíte') || n.includes('suite')) return '🛏️';
  if (n.includes('sala') || n.includes('estar')) return '🛋️';
  if (n.includes('varanda') || n.includes('área') || n.includes('area')) return '🌿';
  if (n.includes('garagem')) return '🚗';
  if (n.includes('escritório') || n.includes('escritorio')) return '💼';
  return '🏠';
}
async function pintarCapas(escopo){
  const alvos = escopo.querySelectorAll('[data-capa]');
  for (const el of alvos){
    const a = A(el.dataset.capa); if (!a) continue;
    const foto = a.arquivos.filter(f => /^image\//.test(f.tipo || '') && f.cat !== 'recibo').sort((x, y) => (y.data || '').localeCompare(x.data || ''))[0];
    if (!foto) continue;
    try {
      const rec = await dbGet('files', foto.id); if (!rec) continue;
      const b = rec.thumb || rec.blob; if (!b) continue;
      const img = new Image(); img.alt = ''; img.loading = 'lazy'; img.src = urlDe(foto.id + ':t', b);
      if (el.classList.contains('capa-box')) { el.innerHTML = ''; img.className = 'capa'; el.appendChild(img); }
      else { el.innerHTML = ''; el.appendChild(img); }
    } catch(e){ console.warn(e); }
  }
}
function vazio(ico, tit, txt, btnId, btnTxt){
  return `<div class="card empty"><div class="big">${ico}</div><b>${esc(tit)}</b><p>${esc(txt)}</p>
    ${btnId ? `<button class="btn" onclick="document.getElementById('${btnId}').click()">${esc(btnTxt || '＋ Adicionar')}</button>` : ''}</div>`;
}

/* ============================ AMBIENTES ============================ */
function renderAmbientes(){
  const u = U();
  $('#listaAmb').innerHTML = u.ambientes.length ? u.ambientes.map(a => {
    const x = totaisAmb(a), area = areaPiso(a);
    const feitasPct = (x.tarefas + x.feitas) ? (x.feitas / (x.tarefas + x.feitas)) * 100 : 0;
    const tot = x.feitas + x.tarefas;
    return `<div class="card tap" role="button" tabindex="0" onclick="irPara('ambiente',{amb:'${a.id}'})">
      <div data-capa="${a.id}" class="capa-box"></div>
      <div class="row"><div class="grow"><b>${icoAmb(a.nome)} ${esc(a.nome)}</b>
        <div class="tiny muted">${area > 0 ? fmtNum(area) + ' m² · ' : ''}${pl(x.arquivos,'arquivo')} · ${pl(x.mats,'material','materiais')}</div>
        ${(() => { const cr = calcRevest(a); return cr.completo && cr.modo !== 'nenhum'
          ? `<div class="tiny" style="color:var(--brand);margin-top:3px">📐 ${fmtM(cr.comPerda)} m² a revestir · ${esc(cr.rotulo.toLowerCase())}</div>` : ''; })()}</div>
        <div class="right"><div class="money">${fmtBRL(x.gasto)}</div>
        ${x.faltando ? `<span class="tag warn">${x.faltando} a comprar</span>` : ''}</div></div>
      ${tot ? `<div class="bar"><i style="width:${feitasPct}%"></i></div>
      <div class="tiny muted" style="margin-top:6px">${x.feitas} de ${tot} ${tot === 1 ? 'tarefa concluída' : 'tarefas concluídas'}</div>` : ''}
    </div>`;
  }).join('') : vazio('◫','Nenhum ambiente','Cadastre os cômodos da obra para organizar plantas, materiais e tarefas.','addAmb','＋ Novo ambiente');

}

/* ============================ AMBIENTE (detalhe) ============================ */
function renderAmbiente(){
  const a = A(ui.amb);

  $('#ambHead').innerHTML = `
    <div class="row" style="align-items:flex-start"><div class="grow mini">
        ${ap > 0 ? `<div><span>Piso</span><b>${fmtNum(ap)} m²</b></div>
          <div><span>${c.usaParede ? 'Paredes' : 'Pé-direito'}</span><b>${c.usaParede ? fmtNum(c.paredeLiq) + ' m²' : (parseNum(a.peDireito) ? fmtNum(a.peDireito) + ' m' : '—')}</b></div>` : ''}
        <div><span>Gasto</span><b>${fmtBRL(x.gasto)}</b></div>
        <div><span>${x.faltando ? 'A comprar' : 'Previsto'}</span><b${x.faltando ? ' style="color:var(--warn)"' : ''}>${fmtBRL(x.faltando ? x.previsto - x.gasto : x.previsto)}</b></div></div>
      <button class="iconbtn" onclick="editarAmbiente('${a.id}')" aria-label="Editar ambiente" title="Editar ambiente">✎</button></div>

    <div style="height:10px"></div>

  $('#ambRevest').innerHTML = c.modo === 'nenhum' ? '' : `<div class="card">

  const tabs = [['arquivos', '▣ Arquivos', x.arquivos], ['materiais', '▤ Materiais', x.mats], ['tarefas', '✓ Tarefas', x.tarefas]];

  const box = $('#ambConteudo');
  if (ui.ambTab === 'arquivos'){
    const cats = ['all'].concat(Object.keys(CATS).filter(k => a.arquivos.some(f => f.cat === k)));
    box.innerHTML = (cats.length > 2 ? `<div class="chipwrap"><div class="chips">${cats.map(k =>
        `<button class="chip ${ui.filtroCat === k ? 'on' : ''}" onclick="setFiltroCat('${k}')">${k === 'all' ? 'Tudo' : CATS[k]}</button>`).join('')}</div></div>` : '')
      + `<div class="grid" id="gridAmbArq"></div><div id="vazioAmbArq"></div><div style="height:12px"></div>
      <button class="btn wide gh" onclick="pedirArquivos('${a.id}')">＋ Adicionar planta ou foto</button>`;
    if (cats.length <= 2) ui.filtroCat = 'all';
    pintarArquivos(a.arquivos.filter(f => ui.filtroCat === 'all' || f.cat === ui.filtroCat), $('#gridAmbArq'), $('#vazioAmbArq'), a.id);
  } else if (ui.ambTab === 'materiais'){
    box.innerHTML = listaMateriaisHTML(a.materiais.map(m => ({...m, ambId:a.id})), false)
      + `<button class="btn wide gh" onclick="editarMaterial(null,'${a.id}')">＋ Novo material</button>`;
  } else {
    const ts = a.tarefas.map(t => ({...t, ambId:a.id, amb:a.nome})).filter(t => ui.verFeitas || !t.feita).sort(ordenaTarefa);
    box.innerHTML = (ts.length ? '<div class="list">' + ts.map(t => linhaTarefa(t, false)).join('') + '</div>'
      : vazio('✓','Sem tarefas','Anote o que falta fazer neste ambiente.'))
      + `<button class="btn wide gh" onclick="editarTarefa(null,'${a.id}')">＋ Nova tarefa</button>`;

}

window.copiarRevest = async ambId => {
  const a = A(ambId); if (!a) return;
  const c = calcRevest(a);
  if (!c.completo) return toast('Informe as medidas primeiro.');
  const L = [`${a.nome} — cálculo de revestimento`, `${c.rotulo}`, ''];
  L.push(`Medidas: ${fmtM(a.largura)} × ${fmtM(a.comprimento)} m, pé-direito ${fmtM(a.peDireito)} m`);
  if (c.usaPiso) L.push(`Piso: ${fmtM(a.largura)} × ${fmtM(a.comprimento)} = ${fmtM(c.piso)} m²`);
  if (c.usaParede){
    L.push(`Perímetro: 2 × (${fmtM(a.largura)} + ${fmtM(a.comprimento)}) = ${fmtM(c.perimetro)} m`);
    L.push(`Paredes até ${fmtM(c.alt)} m: ${fmtM(c.perimetro)} × ${fmtM(c.alt)} = ${fmtM(c.paredeBruta)} m² brutos`);
    (a.revest.aberturas || []).forEach(ab => {
      const hEf = Math.min(parseNum(ab.altura), c.alt || parseNum(ab.altura));
      const q = Math.max(1, parseNum(ab.qtd) || 1);
      L.push(`  − ${ab.nome}: ${fmtM(ab.largura)} × ${fmtM(hEf)}${hEf < parseNum(ab.altura) ? ` (de ${fmtM(ab.altura)} m, só a parte revestida)` : ''} × ${q} = ${fmtM(parseNum(ab.largura) * hEf * q)} m²`);
    });
    if (c.descontos > 0) L.push(`Paredes líquidas: ${fmtM(c.paredeBruta)} − ${fmtM(c.descontos)} = ${fmtM(c.paredeLiq)} m²`);
  }
  L.push('', `Total: ${fmtM(c.total)} m²`, `Com ${fmtNum(c.perda)}% de perda: ${fmtM(c.comPerda)} m²`);
  if (c.caixas) L.push(`Caixas de ${fmtM(c.m2Caixa)} m²: ${c.caixas} (arredondando para cima)`);
  toast(await copiar(L.join('\n')) ? '📐 Cálculo copiado' : 'Não consegui copiar');
};

/* ============================ MATERIAIS ============================ */
function chipsAmbiente(alvo, valor, fn){
  const u = U();
  alvo.innerHTML = [`<button class="chip ${valor === 'all' ? 'on' : ''}" onclick="${fn}('all')">Todos</button>`]
    .concat(u.ambientes.map(a => `<button class="chip ${valor === a.id ? 'on' : ''}" onclick="${fn}('${a.id}')">${esc(a.nome)}</button>`)).join('');
}
window.setFiltroAmb = v => { ui.filtroAmb = v; render(); };
window.setFiltroCat = v => { ui.filtroCat = v; render(); };
function materiaisFiltrados(){
  const u = U(), out = [];
  u.ambientes.forEach(a => { if (ui.filtroAmb === 'all' || ui.filtroAmb === a.id)
    a.materiais.forEach(m => out.push({...m, ambId:a.id, amb:a.nome})); });
  return out;
}
function listaMateriaisHTML(mats, mostraAmb){
  if (!mats.length) return vazio('▤','Nenhum material','Cadastre os materiais com quantidade, preço e recibo.');
  return '<div class="list">' + mats.map(m => {

      <div class="grow"><div class="l2"><b>${esc(m.nome)}</b></div>
        <div class="tiny muted ell">${mostraAmb ? esc(m.amb) + ' · ' : ''}estoque ${fmtNum(est)} ${esc(m.unidade || 'un')}${falta > 0 ? ` · faltam ${fmtNum(falta)}` : ''}${recibos ? ` · ${pl(recibos,'recibo')}` : ''}</div>
        <span class="tag ${st.c}" style="margin-top:4px">${st.t}</span></div>
      <div class="right" style="flex:0 0 auto"><div class="money small" style="white-space:nowrap">${fmtBRL(custoMat(m))}</div>
        <div class="tiny muted" style="white-space:nowrap">${falta > 0 ? 'falta ' + fmtBRL(falta * parseNum(m.precoUnit)) : fmtNum(parseNum(m.precoUnit)) + '/' + esc(m.unidade || 'un')}</div></div>
      <div class="muted">›</div></div>`;
  }).join('') + '</div>';
}
function renderMateriais(){
  chipsAmbiente($('#filtroMat'), ui.filtroAmb, 'setFiltroAmb');
  const todos = materiaisFiltrados();
  let gasto = 0, prev = 0, falta = 0, faltaR = 0;
  todos.forEach(m => { gasto += custoMat(m); prev += custoPrev(m);
    if (faltaMat(m) > 0){ falta++; faltaR += faltaMat(m) * parseNum(m.precoUnit); } });
  $('#resumoMat').innerHTML = `<div class="mini">
    <div><span>Itens</span><b>${todos.length}</b></div>
    <div><span>Comprado</span><b>${fmtBRL(gasto)}</b></div>
    <div><span>Previsto</span><b>${fmtBRL(prev)}</b></div>
    <div><span>A comprar</span><b>${fmtBRL(faltaR)}</b></div></div>
    ${falta ? `<div style="height:12px"></div><div class="row" style="gap:8px">
      <button class="btn sm ${ui.soFalta ? '' : 'gh'}" style="flex:1" onclick="ui.soFalta=!ui.soFalta;render()">🛒 ${ui.soFalta ? 'Ver todos os materiais' : `Lista de compras (${falta})`}</button>
      ${ui.soFalta ? `<button class="btn sm gh" onclick="copiarCompras()">Copiar</button>` : ''}</div>` : ''}`;
  const mats = ui.soFalta ? todos.filter(m => faltaMat(m) > 0) : todos;
  $('#listaMat').innerHTML = mats.length ? listaMateriaisHTML(mats, ui.filtroAmb === 'all')
    : vazio('🛒','Nada a comprar','Todos os materiais deste filtro já foram comprados.');
}
window.copiarCompras = async () => {
  const mats = materiaisFiltrados().filter(m => faltaMat(m) > 0);
  if (!mats.length) return toast('Nada a comprar.');
  let tot = 0;
  const linhas = mats.map(m => { const q = faltaMat(m), v = q * parseNum(m.precoUnit); tot += v;
    return `• ${m.nome} — ${fmtNum(q)} ${m.unidade || 'un'}${m.fornecedor ? ` (${m.fornecedor})` : ''} — ${fmtBRL(v)} [${m.amb}]`; });
  const txt = `Lista de compras — ${U().nome} (${fmtData(hoje())})\n\n${linhas.join('\n')}\n\nTotal estimado: ${fmtBRL(tot)}`;
  toast(await copiar(txt) ? '🛒 Lista copiada' : 'Não consegui copiar');
};

/* ============================ TAREFAS ============================ */
function contarPorResp(r){
  const u = U(); let n = 0;
  if (u) u.ambientes.forEach(a => a.tarefas.forEach(t => { if (t.resp === r && !t.feita) n++; }));
  return n;
}
function responsaveis(){
  const u = U(); const set = new Set();
  if (u) u.ambientes.forEach(a => a.tarefas.forEach(t => { if (t.resp) set.add(t.resp); }));
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'pt-BR'));
}
const PRIO = {alta:{t:'Alta', c:'bad', o:0}, normal:{t:'Normal', c:'', o:1}, baixa:{t:'Baixa', c:'', o:2}};
function ordenaTarefa(a, b){
  const pa = (PRIO[a.prioridade] || PRIO.normal).o, pb = (PRIO[b.prioridade] || PRIO.normal).o;
  const da = a.prazo || '9999-12-31', dbz = b.prazo || '9999-12-31';
  if (da !== dbz) return da < dbz ? -1 : 1;
  return pa - pb;
}
function linhaTarefa(t, mostraAmb){
  const d = diasAte(t.prazo);
  let tag = '';
  if (t.prazo){
    if (d < 0) tag = `<span class="tag bad">Venceu ${fmtData(t.prazo)}</span>`;
    else if (d === 0) tag = `<span class="tag warn">Hoje</span>`;
    else if (d <= 3) tag = `<span class="tag warn">Em ${d} dia${d>1?'s':''}</span>`;
    else tag = `<span class="tag">${fmtData(t.prazo)}</span>`;
  }
  if (t.prioridade === 'alta') tag += ' <span class="tag bad">Alta</span>';
  if (t.resp) tag = `<span class="tag">👷 ${esc(t.resp)}</span> ` + tag;
  return `<div class="item ${t.feita ? 'done' : ''}">
    <div class="tapzone" onclick="event.stopPropagation();alternarTarefa('${t.ambId}','${t.id}')" role="checkbox" aria-checked="${!!t.feita}" tabindex="0" aria-label="Concluir ${esc(t.titulo)}">
      <div class="check ${t.feita ? 'on' : ''}">✓</div></div>
    <div class="grow" role="button" tabindex="0" onclick="editarTarefa('${t.id}','${t.ambId}')">
      <div class="l2 tt"><b>${esc(t.titulo)}</b></div>
      <div class="tiny muted">${mostraAmb ? esc(t.amb) : ''}</div>${tag ? `<div style="margin-top:4px">${tag}</div>` : ''}</div>
    <div class="muted">›</div></div>`;
}
window.setFiltroResp = v => { ui.filtroResp = v; render(); };
function renderTarefas(){
  chipsAmbiente($('#filtroTar'), ui.filtroAmb, 'setFiltroAmb');
  const resps = responsaveis();
  $('#wrapResp').style.display = resps.length ? 'block' : 'none';
  $('#filtroResp').innerHTML = resps.length
    ? [`<button class="chip ${ui.filtroResp === 'all' ? 'on' : ''}" onclick="setFiltroResp('all')">Todos</button>`]
      .concat(resps.map(r => {
        const n = contarPorResp(r);
        return `<button class="chip ${ui.filtroResp === r ? 'on' : ''}" onclick="setFiltroResp(${JSON.stringify(r).replace(/"/g, '&quot;')})">👷 ${esc(r)}${n ? ' · ' + n : ''}</button>`;
      })).join('') : '';
  const u = U(); const arr = [];
  u.ambientes.forEach(a => { if (ui.filtroAmb === 'all' || ui.filtroAmb === a.id)
    a.tarefas.forEach(t => { if (ui.filtroResp === 'all' || t.resp === ui.filtroResp) arr.push({...t, ambId:a.id, amb:a.nome}); }); });
  const abertas = arr.filter(t => !t.feita).length, feitas = arr.length - abertas;
  $('#resumoTar').innerHTML = `<b>${abertas}</b> aberta${abertas!==1?'s':''} · ${feitas} concluída${feitas!==1?'s':''}`;
  $('#toggleFeitas').textContent = ui.verFeitas ? 'Ocultar feitas' : 'Mostrar feitas';
  const vis = arr.filter(t => ui.verFeitas || !t.feita).sort(ordenaTarefa);
  $('#listaTar').innerHTML = vis.length ? '<div class="list">' + vis.map(t => linhaTarefa(t, ui.filtroAmb === 'all')).join('') + '</div>'
    : vazio('✓', arr.length ? 'Nada em aberto' : 'Sem tarefas', arr.length ? 'Toque em “Mostrar feitas” para rever o que já foi concluído.' : 'Anote o que falta fazer na obra.');
}
window.alternarTarefa = (ambId, tid) => {
  const a = A(ambId); if (!a) return;
  const t = a.tarefas.find(x => x.id === tid); if (!t) return;
  t.feita = !t.feita; t.feitaEm = t.feita ? hoje() : null;
  salvar(); render();
  if (t.feita) toast('✓ ' + t.titulo);
};

/* ============================ ARQUIVOS ============================ */
function renderArquivos(){
  chipsAmbiente($('#filtroArq'), ui.filtroAmb, 'setFiltroAmb');
  $('#filtroCat').innerHTML = [`<button class="chip ${ui.filtroCat === 'all' ? 'on' : ''}" onclick="setFiltroCat('all')">Tudo</button>`]
    .concat(Object.entries(CATS).map(([k, v]) => `<button class="chip ${ui.filtroCat === k ? 'on' : ''}" onclick="setFiltroCat('${k}')">${v}</button>`)).join('');
  const u = U(), arr = [];
  u.ambientes.forEach(a => { if (ui.filtroAmb === 'all' || ui.filtroAmb === a.id)
    a.arquivos.forEach(f => { if (ui.filtroCat === 'all' || f.cat === ui.filtroCat) arr.push({...f, ambId:a.id, amb:a.nome}); }); });
  const tam = arr.reduce((s, f) => s + (f.tamanho || 0), 0);
  $('#resumoArq').innerHTML = `<b>${arr.length}</b> arquivo${arr.length!==1?'s':''}${tam ? ' · ' + fmtBytes(tam) : ''}`;
  pintarArquivos(arr, $('#gridArq'), $('#vazioArq'), null);
}
async function pintarArquivos(arr, grid, vazioBox, ambId){
  if (!arr.length){
    grid.innerHTML = '';
    vazioBox.innerHTML = vazio('▣','Nenhum arquivo','Guarde aqui plantas, fotos da obra e recibos.',
      ambId ? null : 'addArq', '＋ Adicionar');
    if (ambId) vazioBox.innerHTML = `<div class="card empty"><div class="big">▣</div><b>Nenhum arquivo</b>
      <p>Guarde aqui plantas, fotos da obra e recibos.</p><button class="btn" onclick="pedirArquivos('${ambId}')">＋ Adicionar</button></div>`;
    return;
  }
  vazioBox.innerHTML = '';
  arr.sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  grid.innerHTML = arr.map(f => `<div class="thumb" role="button" tabindex="0" data-fid="${f.id}" data-amb="${f.ambId || ambId}" aria-label="${esc(f.nome)}">
      <div class="doc" data-ph="${f.id}">${icoCat(f.cat)}</div>
      <span class="kind">${esc((CATS[f.cat] || CATS.outro).slice(3))}</span>
      <span class="cap">${esc(f.nome)}</span></div>`).join('');
  grid.querySelectorAll('[data-fid]').forEach(n => n.addEventListener('click', () => abrirArquivo(n.dataset.fid, n.dataset.amb)));
  for (const f of arr){
    if (!/^image\//.test(f.tipo || '')) continue;
    try {
      const rec = await dbGet('files', f.id); if (!rec) continue;
      const b = rec.thumb || rec.blob; if (!b) continue;
      const ph = grid.querySelector(`[data-ph="${f.id}"]`); if (!ph) continue;
      const img = new Image(); img.alt = f.nome || ''; img.loading = 'lazy';
      img.src = urlDe(f.id + ':t', b); ph.replaceWith(img);
    } catch(e){ console.warn(e); }
  }
}
</script>
<script>
"use strict";
/* ============================ MODAL ============================ */
let ovAtual = null;
function modal({titulo, corpo, botoes, aoAbrir}){
  $('#ovTitle').textContent = titulo;
  $('#ovBody').innerHTML = corpo;
  $('#ovFoot').innerHTML = '';
  (botoes || []).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.textContent = b.txt;
    el.onclick = b.fn;
    $('#ovFoot').appendChild(el);
  });
  $('#ov').classList.add('on');
  document.body.style.overflow = 'hidden';
  ovAtual = true;
  if (aoAbrir) setTimeout(aoAbrir, 30);
}
function fecharModal(){ $('#ov').classList.remove('on'); document.body.style.overflow = ''; ovAtual = null; }
$('#ovClose').onclick = fecharModal;
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') fecharModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    const alvo = e.target.closest('[role="button"],[role="checkbox"]');
    if (alvo && !alvo.matches('button,a,input,select,textarea')){ e.preventDefault(); alvo.click(); return; }
  }
  if (e.key !== 'Escape') return;
  if ($('#viewer').classList.contains('on')) return fecharViewer();
  if (ovAtual) fecharModal();
});
function confirmar(titulo, texto, aoConfirmar, txtBtn){
  modal({titulo, corpo:`<p class="small" style="margin:14px 0">${esc(texto)}</p>`,
    botoes:[{txt:'Cancelar', cls:'gh', fn:fecharModal}, {txt:txtBtn || 'Excluir', cls:'dz', fn:() => { fecharModal(); aoConfirmar(); }}]});
}
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };

/* ============================ UNIDADES ============================ */
window.editarUnidade = id => {
  const u = id ? S.unidades.find(x => x.id === id) : null;
  modal({
    titulo: u ? 'Editar unidade' : 'Nova unidade',
    corpo: `<label for="uNome">Nome da unidade *</label><input type="text" id="uNome" value="${esc(u ? u.nome : '')}" placeholder="Ex.: AP 103A — Porto das Dunas">
      <div class="err" id="uErr">Dê um nome à unidade.</div>
      <label for="uEnd">Endereço</label><input type="text" id="uEnd" value="${esc(u ? u.endereco : '')}" placeholder="Opcional">
      <label for="uOrc">Orçamento total (R$)</label><input type="text" inputmode="decimal" id="uOrc" value="${u && parseNum(u.orcamento) ? fmtNum(parseNum(u.orcamento)) : ''}" placeholder="Ex.: 120.000,00">
      <div class="hint">Use vírgula para centavos. Deixe em branco se ainda não houver teto definido.</div>`,
    botoes: [
      ...(u && S.unidades.length > 1 ? [{txt:'Excluir', cls:'dz', fn:() => confirmar('Excluir unidade',
        `Isso apaga “${u.nome}” com todos os ambientes, materiais, tarefas e arquivos. Não dá para desfazer.`, () => excluirUnidade(u.id))}] : []),
      {txt:'Cancelar', cls:'gh', fn:fecharModal},
      {txt:'Salvar', fn:() => {
        const nome = val('uNome');
        if (!nome){ $('#uErr').classList.add('on'); $('#uNome').focus(); return; }
        if (u){ u.nome = nome; u.endereco = val('uEnd'); u.orcamento = parseNum(val('uOrc')); }

      const meta = await guardarArquivo(f, pend.cat, pend.matId);
      a.arquivos.push(meta); novos.push(meta);
      if (pend.matId){ const m = a.materiais.find(x => x.id === pend.matId); if (m){ m.recibos = m.recibos || []; m.recibos.push(meta.id); } }
      ok++;
    } catch(err){ console.error(err); erro++; }
  }
  await salvar(true);
  const cat = pend.cat, mid = pend.matId, amb = pend.ambId; pend = null; e.target.value = '';
  toast(ok ? `${pl(ok,'arquivo')} guardado${ok > 1 ? 's' : ''}${erro ? ` · ${erro} não deu certo` : ''}`
    : 'Não consegui guardar. O arquivo pode ser grande demais ou o aparelho estar sem espaço.', 4200);
  render();
  if (ok && cat === 'recibo') return perguntarValorRecibo(amb, novos, mid);
  if (mid){ const m = A(amb).materiais.find(x => x.id === mid); if (m && ovAtual) await pintarRecibos(amb, m); }
});

}

function blob2b64(b){ return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = () => r(null); f.readAsDataURL(b); }); }
async function backup(comFotos){

  const pacote = {app:'obra-em-dia', v:1, data:new Date().toISOString(), estado:S, arquivos:{}};

function b64toBlob(dataUrl){
  const [h, d] = String(dataUrl).split(',');
  const tipo = (h.match(/data:([^;]+)/) || [,'application/octet-stream'])[1];
  const bin = atob(d); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:tipo});
}

      });
      if (am.obs){ const nova = String(am.obs).trim();
        if (!chave(a.obs || '').includes(chave(nova))) a.obs = (a.obs ? a.obs + '\n' : '') + nova; }
      if (am.revest) a.revest = Object.assign(a.revest || revestPadrao(a.nome), am.revest);

      (am.tarefas || []).forEach(t => {
        if (a.tarefas.some(x => chave(x.titulo) === chave(t.titulo))){ r.pulados++; return; }
        a.tarefas.push({id:uid(), feita:false, criadoEm:hoje(), titulo:t.titulo,
          prazo:t.prazo || '', prioridade:t.prioridade || 'normal', obs:t.obs || '', resp:t.resp || ''});
        r.tarefas++;
      });
      (am.materiais || []).forEach(m => {
        if (a.materiais.some(x => chave(x.nome) === chave(m.nome))){ r.pulados++; return; }
        a.materiais.push({id:uid(), recibos:[], criadoEm:hoje(), nome:m.nome,
          unidade:m.unidade || 'un', precoUnit:parseNum(m.precoUnit), qtdPrevista:parseNum(m.qtdPrevista),
          qtdComprada:parseNum(m.qtdComprada), qtdUsada:parseNum(m.qtdUsada),
          fornecedor:m.fornecedor || '', obs:m.obs || ''});
        r.materiais++;
      });
    });
  });
  return r;
}

$('#listaPick').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  e.target.value = '';
  let pacote;
  try {
    pacote = JSON.parse(await f.text());
    if (!pacote || pacote.app !== 'obra-em-dia-lista' || !Array.isArray(pacote.unidades)) throw 0;
  } catch(err){ return toast('Arquivo inválido — use uma lista gerada para o Obra em Dia.', 4000); }
  const qtd = (pacote.unidades || []).reduce((t, u) => t + (u.ambientes || []).reduce(
    (s2, a) => s2 + (a.tarefas || []).length + (a.materiais || []).length, 0), 0);
  modal({
    titulo:'Importar lista',
    corpo:`<p class="small" style="margin:14px 0 0">${esc(pacote.titulo || 'Lista')} — <b>${qtd} ${qtd === 1 ? 'item' : 'itens'}</b> em ${pl((pacote.unidades || []).length, 'unidade')}.</p>
      <div class="hint">Os itens são <b>acrescentados</b>. Nada é apagado e o que já existe com o mesmo nome é pulado, então dá para importar de novo depois de atualizar a sua lista.</div>`,
    botoes:[{txt:'Cancelar', cls:'gh', fn:fecharModal}, {txt:'Importar', fn:async () => {
      const r = mesclarLista(pacote);
      await salvar(true); fecharModal(); irPara('painel');
      modal({titulo:'Importado', corpo:`<div class="list" style="margin-top:12px">
        ${[['🏠','unidade','unidades',r.unidades],['◫','ambiente','ambientes',r.ambientes],
           ['✓','tarefa','tarefas',r.tarefas],['▤','material','materiais',r.materiais],
           ['📐','medida preenchida','medidas preenchidas',r.medidas]]
          .filter(([,,,n]) => n > 0)
          .map(([i, s1, s2, n]) => `<div class="item"><div class="av">${i}</div><div class="grow"><b>${n}</b> ${n === 1 ? s1 : s2}</div></div>`).join('')
          || '<div class="item"><div class="grow small muted">Nada novo: tudo já estava no app.</div></div>'}
        ${r.pulados ? `<div class="item"><div class="av">↩</div><div class="grow small muted"><b>${r.pulados}</b> ${r.pulados === 1 ? 'item já existia e foi pulado' : 'itens já existiam e foram pulados'}</div></div>` : ''}
        </div>`, botoes:[{txt:'Ver a obra', fn:fecharModal}]});
    }}]
  });
});

$('#copiarTar').onclick = async () => {
  const u = U(); const arr = [];
  u.ambientes.forEach(a => { if (ui.filtroAmb === 'all' || ui.filtroAmb === a.id)
    a.tarefas.forEach(t => { if ((ui.filtroResp === 'all' || t.resp === ui.filtroResp) && !t.feita)
      arr.push({...t, amb:a.nome}); }); });
  if (!arr.length) return toast('Nada em aberto para copiar.');
  arr.sort(ordenaTarefa);
  const quem = ui.filtroResp === 'all' ? '' : ' — ' + ui.filtroResp;
  const txt = [`${u.nome}${quem} (${fmtData(hoje())})`, ''].concat(
    arr.map(t => `• ${t.titulo}${t.amb ? ` [${t.amb}]` : ''}${t.prazo ? ` — até ${fmtData(t.prazo)}` : ''}${t.obs ? `\n   ${t.obs}` : ''}`)).join('\n');
  toast(await copiar(txt) ? '📋 Lista copiada' : 'Não consegui copiar');
};


function migrar(s){
  if (!s || !Array.isArray(s.unidades) || !s.unidades.length) return estadoInicial();
  s.unidades.forEach(u => {
    u.ambientes = u.ambientes || [];
    u.orcamento = parseNum(u.orcamento);
    u.ambientes.forEach(a => {
      a.arquivos = a.arquivos || []; a.materiais = a.materiais || []; a.tarefas = a.tarefas || [];
      const RENOMEAR = {'Quarto Arthur':'Suíte Arthur', 'Quarto Francisco':'Suíte Francisco'};
      if (RENOMEAR[a.nome]) a.nome = RENOMEAR[a.nome];
      if (!a.revest) a.revest = revestPadrao(a.nome);
      a.revest.aberturas = a.revest.aberturas || [];
      a.materiais.forEach(m => { m.recibos = m.recibos || []; });
    });
  });
  if (!s.unidadeAtual || !s.unidades.find(u => u.id === s.unidadeAtual)) s.unidadeAtual = s.unidades[0].id;
  return s;
}
async function limparOrfaos(){
  try {
    const usados = new Set();
    S.unidades.forEach(u => u.ambientes.forEach(a => a.arquivos.forEach(f => usados.add(f.id))));
    const keys = await dbKeys('files');
    for (const k of keys) if (!usados.has(k)) await dbDel('files', k);
  } catch(e){ console.warn(e); }
}
async function iniciar(){
  try {
    const salvo = await dbGet('kv', 'state');
    S = migrar(salvo);
    if (!salvo) await salvar(true);
  } catch(e){
    console.error(e);
    S = estadoInicial();
    toast('⚠️ Não consegui abrir o banco local. Em aba anônima os dados não são guardados.', 6000);
  }
  $('#boot').remove();
  irPara('painel');
  limparOrfaos();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
window.addEventListener('beforeunload', () => { if (salvarT){ clearTimeout(salvarT); dbPut('kv', JSON.parse(JSON.stringify(S)), 'state'); } });
iniciar();
